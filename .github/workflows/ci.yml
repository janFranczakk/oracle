name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-ml.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Install backend
        run: python -m pip install --no-deps -e ./backend
      - name: Install locked CPU ML dependencies
        run: python -m pip install -r backend/requirements-ml.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check backend scripts/benchmark.py
      - name: Check formatting
        run: python -m ruff format --check backend scripts/benchmark.py
      - name: Test
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm exec prettier --check src
      - name: Type check and production build
        run: pnpm run build

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-ml.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked backend and CPU ML dependencies
        run: |
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install --no-deps -e ./backend
          python -m pip install -r backend/requirements-ml.lock.txt
          python -m pip check
      - name: Install pnpm and locked frontend dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir frontend install --frozen-lockfile
      - name: Install browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Prepare actual tiny trained fixture
        run: python -m oracle.setup_demo --root .run/e2e --profile smoke
      - name: Build and type check E2E
        run: |
          pnpm --dir frontend run build
          pnpm --dir frontend exec tsc --project tsconfig.e2e.json
      - name: Run five real browser smoke flows
        run: pnpm --dir frontend run test:e2e
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
